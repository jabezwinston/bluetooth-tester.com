# Shared Kconfig fragment for the ESP32-family hci_uart firmware (Bluetooth-Tester).
# HCI runs on uart0 (the onboard USB-UART bridge). Disable the Zephyr console so it doesn't drive
# uart0 alongside the h4 driver (STDOUT_CONSOLE=n avoids the "no console driver" abort that bare
# UART_CONSOLE=n triggers). Drop controller privacy: this is a raw-HCI controller (no host) so
# BT_CTLR_PRIVACY would y-select BT_RPA without its BT_*_CRYPTO deps and abort the Kconfig parse.
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_UART_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_BOOT_BANNER=n
# The Espressif boot log (mask-ROM "ESP-ROM: …" + soc_init "I (51) …") prints on UART0, the HCI line,
# at every reset. It can't be silenced from a Zephyr fragment (IDF-side Kconfig), so the host drains
# it and waits for the line to go quiet before HCI bring-up — see webserial.js espRunReset().
