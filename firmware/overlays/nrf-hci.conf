# Shared Kconfig fragment for the nRF-family hci_uart firmware (Bluetooth-Tester). The stock
# samples/bluetooth/hci_uart leaves these controller features off; enable the ones the app drives.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y

# Direct Test Mode (RF Test) over HCI — without this the controller answers test commands with
# "Unknown HCI Command" even though its Supported_Commands bitmap advertises them. v1/v2; the v4
# (per-test TX power) variant additionally needs TX power dynamic control below.
CONFIG_BT_CTLR_DTM_HCI=y

# PHYs — for DTM PHY selection (and 2M/Coded connections).
CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_CTLR_PHY_CODED=y

# TX power: dynamic control enables the DTM v4 per-test power parameter; +8 dBm is nRF52840-only
# (ignored with a warning on parts that don't support it).
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Extended advertising — the app's extended-adv mode. NOTE: a raw-HCI controller locks to legacy OR
# extended on first use; the app's bring-up deliberately avoids pre-locking a mode (see controller.js).
CONFIG_BT_CTLR_ADV_EXT=y

# Max extended advertising data the controller will accept. Without this the symbol takes its range-
# minimum default (31), so the controller answers Command Disallowed (0x0c) to LE Set Ext Adv Data for
# any payload over ~31 bytes — defeating the whole point of extended advertising. 251 is the largest a
# single HCI LE Set Ext Adv Data op can carry; going above 191 requires the Advertising Data chaining
# feature (it lifts the 31..191 range cap and pulls in AUX_CHAIN_IND / back-to-back trains). Chaining
# applies to non-connectable extended + periodic advertising; connectable sets still fit one AUX_ADV_IND.
CONFIG_BT_CTLR_ADV_DATA_CHAIN=y
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=251

# LL privacy (RPA) + Channel Selection #2. (nRF has the crypto deps; unlike the ESP build we keep
# privacy on — see esp-hci.conf for why it's disabled there.)
CONFIG_BT_CTLR_PRIVACY=y
CONFIG_BT_CTLR_CHAN_SEL_2=y
